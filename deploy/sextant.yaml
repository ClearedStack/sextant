apiVersion: v1
kind: ServiceAccount
metadata:
  name: sextant
  namespace: cs-workers
  labels:
    app.kubernetes.io/name: sextant
    app.kubernetes.io/part-of: clearedstack
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sextant
  namespace: cs-workers
  labels:
    app.kubernetes.io/name: sextant
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: clearedstack
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sextant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sextant
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: clearedstack
    spec:
      serviceAccountName: sextant
      # Muster authenticates Sextant with Kubernetes TokenReview against
      # this pod's projected ServiceAccount token.
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - cm3588-plus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sextant
          # Built reproducibly with ko (.ko.yaml, base image pinned by
          # digest) and pushed to Lazarette by Keelworks. Before Lazarette
          # is deployed, this digest records the reproducible linux/arm64
          # sextant binary SHA-256; Keelworks replaces it with the pushed
          # OCI manifest digest in Lazarette before Shipkeeper applies it.
          image: lazarette.clearedstack.svc.cluster.local:5000/sextant@sha256:206b74e6044840e053eb9d816a0842b0a9ae21035340f58a6638e8e822c47b0e
          imagePullPolicy: IfNotPresent
          args:
            - work
            - -muster-url
            - http://muster.clearedstack.svc.cluster.local:8080
            - -spool
            - /var/spool/cs
          env:
            - name: CONTRACT_VERSION
              value: v1
            - name: MUSTER_URL
              value: http://muster.clearedstack.svc.cluster.local:8080
            - name: SEXTANT_SPOOL_DIR
              value: /var/spool/cs
            - name: GOMEMLIMIT
              value: 20MiB
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 30Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: spool
              mountPath: /var/spool/cs
      volumes:
        # emptyDir survives container restarts on any arm64 worker node;
        # swap for a PersistentVolumeClaim if node-reschedule spool
        # persistence is provisioned.
        - name: spool
          emptyDir:
            sizeLimit: 16Mi
